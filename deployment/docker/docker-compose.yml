services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: bus_transit_db
    ports:
      # 3306 is often taken by a local MySQL install; override with MYSQL_HOST_PORT in .env
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  backend:
    build:
      context: ../../backend
    environment:
      PORT: "5000"
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-change_me}@tcp(mysql:3306)/bus_transit_db?parseTime=true
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
