publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  provider: ^6.1.2
  geolocator: ^13.0.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  google_maps_flutter: ^2.9.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

